name: Build CasioEmuMsvc with male Discord avatar and Windows GUI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout upstream stable source
        uses: actions/checkout@v4
        with:
          repository: telecomadm1145/CasioEmuMsvc
          ref: stable
          submodules: recursive

      - name: Apply customization files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Rokaizo/CasioEmuMsvc/main/assets/male_avatar_64.png" -OutFile "male_avatar_64.png"

          py -3 -m pip install --disable-pip-version-check pillow
          @'
from PIL import Image
img = Image.open("male_avatar_64.png").convert("RGBA")
img.save(r"CasioEmuMsvc/icon.ico", format="ICO", sizes=[(64,64),(48,48),(32,32),(16,16)])
'@ | Set-Content -Encoding UTF8 convert_icon.py
          py -3 convert_icon.py

          $config = "CasioEmuMsvc/src/Config.hpp"
          $text = Get-Content -Raw $config
          $text = [regex]::Replace($text, '#define DISCORD_APP_ID\s+"[^"]+"', '#define DISCORD_APP_ID "1552675987047841832"')
          Set-Content -Path $config -Value $text -NoNewline

          $rpc = "CasioEmuMsvc/src/Ext/DiscordRPC.cpp"
          $text = Get-Content -Raw $rpc
          $needle = '        discordPresence.details = details_str.c_str();'
          if ($text -notmatch 'discordPresence\.largeImageKey') {
            $replacement = $needle + [Environment]::NewLine +
              '        discordPresence.largeImageKey = "discord_avatar_male_512";' + [Environment]::NewLine +
              '        discordPresence.largeImageText = "CasioEmuMsvc";'
            $text = $text.Replace($needle, $replacement)
          }
          $text = $text.Replace('https://github.com/telecomadm1145/CasioEmuMsvc', 'https://github.com/Rokaizo/CasioEmuMsvc')
          Set-Content -Path $rpc -Value $text -NoNewline

          $cmake = "CasioEmuMsvc/CMakeLists.txt"
          $text = Get-Content -Raw $cmake
          $oldLine = '        add_executable($' + '{TARGET_NAME} $' + '{MAIN_SOURCES} $' + '{WIN_RESOURCES})'
          $newLine = '        add_executable($' + '{TARGET_NAME} WIN32 $' + '{MAIN_SOURCES} $' + '{WIN_RESOURCES})'
          if (-not $text.Contains($oldLine)) {
            throw "Expected add_executable line not found in CMakeLists.txt"
          }
          $text = $text.Replace($oldLine, $newLine)
          Set-Content -Path $cmake -Value $text -NoNewline

      - name: Configure and build x64
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -A x64 -DBUILD_EXECUTABLE=ON
          cmake --build build-x64 --config Release --parallel

      - name: Upload x64 build
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-Windows-x64-male-avatar-gui
          path: build-x64\CasioEmuMsvc\Release
          if-no-files-found: error
