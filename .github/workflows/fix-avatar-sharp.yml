name: Fix README avatar sharpness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sharper ICO
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          from PIL import Image, ImageFile, ImageFilter
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          im = Image.open("assets/casioemumsvc-male.jpg").convert("RGB")
          im = im.resize((128, 128), Image.Resampling.LANCZOS)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=115, threshold=2))
          im.save(
              "CasioEmuMsvc/icon.ico",
              format="ICO",
              sizes=[(16,16),(32,32),(48,48),(64,64),(96,96),(128,128)]
          )
          PY

      - name: Commit result and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/avatar_parts
          rm -f .github/workflows/fix-avatar-sharp.yml
          git add CasioEmuMsvc/icon.ico .github/avatar_parts .github/workflows/fix-avatar-sharp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Làm nét icon nhân vật nam"
          git push