<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="sharpen" x="-10%" y="-10%" width="120%" height="120%">
      <feConvolveMatrix order="3"
        kernelMatrix="0 -0.15 0 -0.15 1.6 -0.15 0 -0.15 0"
        preserveAlpha="true"/>
    </filter>
    <filter id="contrast">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.08" intercept="-0.02"/>
        <feFuncG type="linear" slope="1.08" intercept="-0.02"/>
        <feFuncB type="linear" slope="1.08" intercept="-0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="128" height="128" fill="white"/>
  <image href="data:image/jpeg;base64,"
         x="0" y="0" width="128" height="128"
         preserveAspectRatio="none"
         filter="url(#sharpen)"/>
</svg>